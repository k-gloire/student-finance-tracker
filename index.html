<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="witdth=device-width, initial-scale=1.0">
    <title>PRISM</title>    
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/form.css">
</head>
<body>
    <a class="skip-link" href="#main">Jump to content</a>

     <header>
         <h1>PRISM</h1>
         <nav aria-label="Main">
            <ul>
                <li><a href="#dashboard">Dashboard</a></li>
                <li><a href="#records">Records</a></li>
                <li><a href="#form">Add</a></li>
                <li><a href="#settings">Settings</a></li>
                <li><a href="#about">About</a></li>
            </ul>
         </nav>
        </header>
        
    
<main id="main" tabindex="-1">
    <section id="dashboard" aria-labelledby="dashboard-title">
     <h2 id="dashboard-title">Dashboard</h2>
    </section>

    <section id="records" aria-labelledby="records-title">
      <h2 id="records-title">Records</h2>
    </section>

    <section id="form" aria-labelledby="form-title">
    <h2 id="form-title">Add/edit record</h2>
    <form id="record-form" novalidate>

        <div class="field">
            <label for="description">Description</label>
            <input type="text" id="description" name="description" autocomplete="off" aria-describedby="description-error">
            <p class="error" id="description-error" aris-live="polite"></p>
        </div>

        <div class="field">
            <label for="amount">Amount</label>
            <input type="text" id="amount" name="amount" inputmode="decimal" autocomplete="off" aria-describedby="amount-error">
            <p class="error" id="amount-error" aria-live="polite"></p>
        </div>

        <div class="field">
        <label for="category">Category</label>
        <select id="category" name="category" aria-describedby="category-error"></select>
        <p class="error" id="category-error" aria-live="polite"></p>
        </div>

        <div class="field">
        <label for="date">Date(YYYY-MM-DD)</label>
        <input type="text" id="date" name="date" inputmode="numeric" autocomplete="off" placeholder="2026-10-12" aria-describedby="date-error">
        <p class="error" id="date-error" aria-live="polite"></p>
        </div>

        <div class="form-actions">
            <button type="submit">Save</button>
            <button type="reset">Cancel</button>
        </div>

        <p id="form-status" role="status"></p>
    </form>
    </section>

    <section id="settings" aria-labelledby="settings-title">
        <h2 id="settings-title">Settings</h2>
    </section>

    <section id="about" aria-labelledby="about-title">
        <h2 id="about-title">About</h2>
    </section>
</main>

<footer>
    <p>PRISM &middot; 2026 &middot;; Umuhendakazi Keza Gloire</p>
</footer>

<script type="module" src="scripts/main.js"></script>
</body>
</html>
