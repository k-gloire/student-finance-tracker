<!DOCTYPE html>
<html lang="en">
    <head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PRISM tests</title>
<link rel="stylesheet" href="styles/main.css">
<style>
    .fail {
        color: #b42318;
        font-weight: bold;
    }
</style>
    </head>
    <body>
        <main>
            <h1>PRISM validator tests</h1>
            <p id="summary" role="status">Running tests...</p>
            <ul id="results">results</ul>
        </main>
        
        <script type="module">
            import {
                checkDescription,
                checkAmount,
                checkDate,
                checkCategory,
                checkRate,
                validateRecordList,
            } from "./scripts/validators.js";

            const checkImport = (data) => (validateRecordList(data).length === 0 ? "": "invalid");

            const good = { 
                id: "txn_0001",
                description: "Lunch",
                amount: 15.5,
                category: "Food",
                date: "2026-10-11",
                createdAt: "2026-10-11T10:00:00.0000Z",
                updatedAt: "2026-10-11T10:00:00.0000Z",
            };

            const tests = [
                ["Amount: 0 is valid",checkAmount,"0",true],
                ["Amount: 12 is valid",checkAmount,"12",true],
                ["Amount: 12.5 is valid",checkAmount,"12.5",true],
                ["Amount: 89.99 is valid",checkAmount,"89.99",true],
                ["Amount: leading zero 014 is rejected",checkAmount,"014",false],
                ["Amount: 3 decimals 10.9899 is rejected",checkAmount,"10.9899",false],
                ["Amount:  negative -4 is rejected",checkAmount,"-5",false],
                ["Amount: letters abc are rejected",checkAmount,"abc",false],
                ["Amount: .5 is rejected",checkAmount,".5",false],
                ["Amount: 1,000 is rejected",checkAmount,"1,000",false],
                ["Amount: empty is rejected",checkAmount,"",false],

                ["Description: Lunch at cafeteria is valid",checkDescription,"Lunch at cafeteria",true],
                ["Description: single characters a b is valid",checkDescription,"a",true],
                ["Description: tricky characters are allowed",checkDescription,"<b>Tea & cake",true],
                ["Description: leading space is rejected",checkDescription," lunch",false],
                ["Description: trailing space is rejected",checkDescription,"lunch  ",false],
                ["Description: repeated word tea tea is rejected",checkDescription,"tea tea",false],
                ["Description: repeated word ignore case (Tea tea)",checkDescription,"Tea tea",false],
                ["Description: empty is rejected",checkDescription,"",false],

                ["Date: 2026-10-11 is valid",checkDate,"2026-10-11",true],
                ["Date: leap day 2024-02-29 is valid",checkDate,"2024-02-29",true],
                ["Date: 2025-02-29 is rejected (not a leap year)",checkDate,"2025-02-29",false],
                ["Date: month 13 is rejected",checkDate,"2026-13-01",false],
                ["Date: month 00 is rejected",checkDate,"2026-00-11",false],
                ["Date: two-digit year is rejected",checkDate,"26-10-11",false],
                ["Date: slashes are rejected",checkDate,"2026/10/11",false],
                ["Date: empty is rejected",checkDate,"",false],

                ["Category: Food is valid",checkCategory,"Food",true],
                ["Category: Fast-food is valid",checkCategory,"Fast-food",true],
                ["Category: Food Drinks is valid",checkCategory,"Food Drinks",true],
                ["Category: digits Food2 are rejected",checkCategory,"Food2",false],
                ["Category: double space is rejected",checkCategory,"Food  Drinks",false],
                ["Category: leading hyphen is rejected",checkCategory,"-Food",false],
                ["Category: trailing hyphen is rejected",checkCategory,"Food-",false],
                ["Category: empty is rejected",checkCategory,"",false],
            

                ["Rate: 1500 is valid", checkRate, "1500", true],
                ["Rate: 1.05 is valid", checkRate, "1.05", true],
                ["Rate: 0.000001 is valid", checkRate, "0.000001", true],
                ["Rate: 7 decimals id rejected", checkRate, "0.00000001", false],
                ["Rate: zero is rejected", checkRate, "0", false],
                ["Rate: leading zero 015 is rejected", checkRate, "015", false],
                ["Rate: letters are rejected", checkRate, "xyz", false],
                ["Rate: comma 1,8 is rejected", checkRate, "1,8", false],

                ["Import: one good record is valid", checkImport, [good], true],
                ["Import: an empty list is valid", checkImport, [], true],
                ["Import: amount 0.01 is valid", checkImport, [{ ...good,amount: 0.01}], true],
                ["Import: repeated word is allowed in files", checkImport, [{ ...good, description: "coffee coffee" }], true],
                ["Import: text instead of a list is rejected", checkImport, "not a list", false],
                ["Import: an object instead of a list is rejected", checkImport, { records: []}, false],
                ["Import: duplicate ids are rejected", checkImport, [good, good], false],
                ["Import: impossible date 2026-02-31 is rejected", checkImport, [{ ...good, date: "2026-02-31" }], false],
                ["Import: amount as a text is rejected", checkImport, [{ ...good, amount: "1.344"}], false],
                ["Import: negative amount is rejected", checkImport, [{ ...good, amount: -1}], false],
                ["Import:  3 decimals is rejected", checkImport, [{ ...good, amount: 1.233 }], false],
                ["Import: leading space in description is rejected", checkImport, [{ ...good, description: " x"}], false],
                ["Import: category with a digit is rejected", checkImport, [{ ...good, category: "Food2" }], false],
                ["Import: missing id is rejected", checkImport, [{ ...good, id: undefined }], false],
                ["Import: bad timestamp is rejected", checkImport, [{ ...good, createdAt: "yesterday" }], false],
                ["Import: null item is rejected", checkImport, [null], false],

                ];

            const list = document.getElementById("results");
            const summary = document.getElementById("summary");
            let passed = 0;

            for (const [name, checker, input,shouldBeValid] of tests) {
                const isValid = checker(input) === "";
                const ok = isValid === shouldBeValid;
                console.assert(ok, "FAILED: " +name);
                if(ok) {
                    passed +=1;
                }
                const item = document.createElement("li");
                item.textContent = (ok ? "PASS: ": "FAIL: ") + name;
                if(!ok) {
                    item.className = "fail";
                }
                list.append(item);
            }
        summary.textContent = passed + " of " + tests.length + " tests passed";
        </script>
    </body>
</html>
